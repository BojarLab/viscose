name: Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, since glycorender and numpy have no upper bound here and raster._box_blur is private to glycorender
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest and newest Python: breakage shows up there, and jobs waiting for a scarce macOS runner have failed runs
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
      - name: Run tests
        run: pytest -q tests

  # The lowest glycorender that pyproject.toml allows, which test no longer installs once a newer one is on PyPI
  oldest-glycorender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
          python -m pip install "glycorender==$(sed -n 's/.*"glycorender>=\([0-9.]*\)".*/\1/p' pyproject.toml)"
      - name: Run tests
        run: pytest -q tests

  # Publishing runs the same check, but only once a release is out
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Check the wheel
        run: python .github/scripts/check_wheel.py dist
